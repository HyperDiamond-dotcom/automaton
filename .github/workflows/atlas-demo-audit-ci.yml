name: Atlas DEMO Read-Only Audit
on:
  push:
    paths: ['atlas-demo-audit*.mjs', '.github/workflows/atlas-demo-audit-ci.yml']
  pull_request:
    paths: ['atlas-demo-audit*.mjs', '.github/workflows/atlas-demo-audit-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check atlas-demo-audit-core.mjs
      - run: node --check atlas-demo-audit.mjs
      - run: node --test atlas-demo-audit.test.mjs
